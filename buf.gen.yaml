version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      path: kserve/grpc_predict_v2.proto
      value: github.com/zavisoft/search-engine/internal/gen/inference
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/zavisoft/search-engine
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/zavisoft/search-engine
