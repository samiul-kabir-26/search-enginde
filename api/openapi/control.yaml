components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT (EdDSA)}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stored for 24 h.
      schema: {type: string, maxLength: 255}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
      required: [type, title, status]
    FieldError:
      type: object
      properties:
        path: {type: string, description: JSON Pointer}
        code: {type: string}
        message: {type: string}
      required: [path, code, message]
    SignupRequest:
      type: object
      properties:
        company_name: {type: string}
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'}
        region: {type: string}
        plan: {type: string}
        email: {type: string, format: email}
        password: {type: string, minLength: 12, description: At least auth.password_min_length characters (default 12).}
      required: [company_name, slug, region, plan, email, password]
    LoginRequest:
      type: object
      properties:
        tenant: {type: string, description: Tenant slug}
        email: {type: string, format: email}
        password: {type: string}
      required: [tenant, email, password]
    SessionResponse:
      type: object
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, description: Seconds}
        tenant_id: {type: string, description: Absent for platform admins}
        user: {$ref: '#/components/schemas/User'}
      required: [access_token, token_type, expires_in]
    TokenRequest:
      type: object
      properties:
        api_key: {type: string}
      required: [api_key]
    TokenResponse:
      type: object
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer}
      required: [access_token, token_type, expires_in]
    JWKS:
      type: object
      properties:
        keys:
          type: array
          items: {type: object, additionalProperties: true}
      required: [keys]
    Scope:
      type: string
      enum: ['search:read', 'search:debug', 'events:write']
    ApiKeyCreate:
      type: object
      properties:
        scopes:
          type: array
          items: {$ref: '#/components/schemas/Scope'}
          default: ['search:read', 'events:write']
    ApiKey:
      type: object
      properties:
        id: {type: string}
        prefix: {type: string}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/Scope'}
        created_at: &id004 {type: string, format: date-time}
        last_used_at: *id004
        revoked_at: *id004
      required: [id, prefix, scopes, created_at]
    ApiKeyCreated:
      type: object
      properties:
        api_key: {type: string, description: The secret; shown once.}
        key: {$ref: '#/components/schemas/ApiKey'}
      required: [api_key, key]
    Role:
      type: string
      enum: [owner, admin, developer, viewer]
    User:
      type: object
      properties:
        id: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        email_verified: {type: boolean}
        created_at: *id004
      required: [id, email, role, email_verified, created_at]
    UserCreate:
      type: object
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        password: {type: string, description: Initial password; the policy applies.}
      required: [email, role, password]
    UserUpdate:
      type: object
      properties:
        role: {$ref: '#/components/schemas/Role'}
      required: [role]
    OnboardingStep:
      type: string
      enum: [account, engine_tour, catalog, retrieval, policies, ranking, personalization, index_build, playground, go_live]
    OnboardingState:
      type: object
      properties:
        current_step: {type: string, description: 'An OnboardingStep, or done'}
        completed_steps:
          type: array
          items: {$ref: '#/components/schemas/OnboardingStep'}
        steps:
          type: array
          items: {$ref: '#/components/schemas/OnboardingStep'}
          description: All steps in order
      required: [current_step, completed_steps, steps]
    StepPayload:
      description: The schema for the step in the path (bodies of different steps can overlap); engine_tour and playground
        take an empty object.
      anyOf:
      - {$ref: '#/components/schemas/CatalogStep'}
      - {$ref: '#/components/schemas/RetrievalStep'}
      - {$ref: '#/components/schemas/PoliciesStep'}
      - {$ref: '#/components/schemas/RankingStep'}
      - {$ref: '#/components/schemas/PersonalizationStep'}
      - {$ref: '#/components/schemas/IndexBuildStep'}
      - {$ref: '#/components/schemas/GoLiveStep'}
      - {type: object, maxProperties: 0}
    StepResult:
      type: object
      properties:
        step: {$ref: '#/components/schemas/OnboardingStep'}
        next_step: {type: string, description: 'An OnboardingStep, or done'}
        warnings: &id005
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
        data: {type: object, additionalProperties: true, description: 'index_build: {version, job}; go_live: {version, state,
            api_key?, key?} (the key is created once)'}
        state: {$ref: '#/components/schemas/OnboardingState'}
      required: [step, next_step, warnings, state]
    EngineExplainer:
      type: object
      properties:
        stages:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              number: {type: integer}
              title: {type: string}
              summary: {type: string}
              configurable:
                type: array
                items: {type: string}
              default: {type: string}
              injection: {type: string, description: Where a custom model or store plugs in}
              step: {$ref: '#/components/schemas/OnboardingStep'}
              badge:
                type: string
                enum: [Default, Custom]
                description: Tenant view only
              choice: {type: string, description: 'Tenant view only: the current choice'}
            required: [id, number, title, summary, configurable, default, injection, step]
      required: [stages]
    ConfigDocument:
      type: object
      description: Tenant pipeline config, schema_version 1 (docs/TENANT_CONFIG.md §3). Skeleton; the full schema is defined
        in the milestone that implements this endpoint.
      required: [schema_version]
      properties:
        schema_version: {type: integer, const: 1}
      additionalProperties: true
    ValidationResult:
      type: object
      properties:
        valid: {type: boolean}
        errors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
      required: [valid, errors]
    ConfigVersionState:
      type: string
      enum: [published, active, shadow, retired]
    ConfigVersionSummary:
      type: object
      properties:
        version: {type: integer}
        state: {$ref: '#/components/schemas/ConfigVersionState'}
        shadow_sample_rate: {type: number, minimum: 0, maximum: 0.2}
        created_at: *id004
        created_by: {type: string}
      required: [version, state, created_at]
    ConfigVersion:
      allOf:
      - {$ref: '#/components/schemas/ConfigVersionSummary'}
      - type: object
        properties:
          document: {$ref: '#/components/schemas/ConfigDocument'}
        required: [document]
    ShadowRequest:
      type: object
      properties:
        sample_rate: {type: number, minimum: 0, maximum: 0.2, description: 0 clears shadow mode}
      required: [sample_rate]
    ConfigDiff:
      type: object
      properties:
        from: {type: integer}
        to: {type: integer}
        changes:
          type: array
          items:
            type: object
            properties:
              op:
                type: string
                enum: [add, remove, replace]
              path: {type: string, description: JSON Pointer}
              from: {}
              to: {}
            required: [op, path]
      required: [from, to, changes]
    SecretCreate:
      type: object
      properties:
        kind: {type: string}
        value: {type: string, writeOnly: true}
      required: [kind, value]
    SecretRef:
      type: object
      properties:
        secret_ref: {type: string}
      required: [secret_ref]
    ConnectionInput:
      type: object
      properties:
        kind:
          type: string
          enum: [vector_store, lexical]
        type:
          type: string
          enum: [qdrant, pgvector, milvus, opensearch]
        endpoint: {type: string, format: uri}
        secret_ref: {type: string}
        settings: {type: object, additionalProperties: true}
      required: [kind, type, endpoint]
    Connection:
      allOf:
      - {$ref: '#/components/schemas/ConnectionInput'}
      - type: object
        properties:
          id: {type: string}
          status: {type: string}
          last_tested_at:
            type: [string, 'null']
            format: date-time
          last_error:
            type: [string, 'null']
        required: [id, status]
    ConnectionTestResult:
      type: object
      properties:
        ok: {type: boolean}
        checks:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              ok: {type: boolean}
              message: {type: string}
              latency_ms: {type: number}
            required: [name, ok]
      required: [ok, checks]
    ModelInput:
      type: object
      properties:
        kind:
          type: string
          enum: [embedder, prerank, rank, rerank]
        type:
          type: string
          enum: [onnx, kserve_v2, openai_embeddings]
        name: {type: string}
        version: {type: string}
        endpoint: {type: string, format: uri}
        artifact_uri: {type: string}
        secret_ref: {type: string}
        supports_text_to_image: {type: boolean}
        max_batch_size: {type: integer}
        input_schema: {type: object, additionalProperties: true}
        output_schema: {type: object, additionalProperties: true}
      required: [kind, type, name, version, input_schema, output_schema]
    Model:
      allOf:
      - {$ref: '#/components/schemas/ModelInput'}
      - type: object
        properties:
          id: {type: string}
          status: {type: string}
          artifact_sha256: {type: string}
          validated_at:
            type: [string, 'null']
            format: date-time
        required: [id, status]
    ModelValidation:
      type: object
      properties:
        ok: {type: boolean}
        checks:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              ok: {type: boolean}
              message: {type: string}
            required: [name, ok]
        latency_ms: {type: number}
      required: [ok, checks]
    PlatformModel:
      type: object
      properties:
        id: {type: string}
        kind: {type: string}
        dim: {type: integer}
        description: {type: string}
      required: [id, kind]
    UploadRequest:
      type: object
      properties:
        format:
          type: string
          enum: [jsonl]
          default: jsonl
    PresignedUpload:
      type: object
      properties:
        upload_id: {type: string, description: Pass to POST .../index/jobs}
        method: {type: string, const: PUT}
        url: {type: string}
        headers:
          type: object
          additionalProperties: {type: string}
        expires_at: *id004
      required: [upload_id, method, url, headers, expires_at]
    IndexJobCreate:
      type: object
      properties:
        config_version: {type: integer}
        upload_id: {type: string, description: Index this upload; without it the job backfills from the catalog topic}
      required: [config_version]
    IndexJob:
      type: object
      properties:
        id: {type: string}
        config_version: {type: integer}
        source:
          type: string
          enum: [topic, upload]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        total: {type: integer}
        done: {type: integer}
        failed: {type: integer}
        index_version: {type: integer}
        error: {type: string}
        created_at: *id004
        started_at: *id004
        finished_at: *id004
      required: [id, config_version, source, status, total, done, failed, created_at]
    MappingPreviewRequest:
      type: object
      properties:
        field_mapping: &id006
          type: object
          additionalProperties: {type: string, description: JSONPath}
          description: Platform field name to JSONPath in the tenant document
        custom_fields:
          type: array
          items: {$ref: '#/components/schemas/CustomField'}
        samples:
          type: array
          items: &id007 {type: object, additionalProperties: true}
          minItems: 1
          maxItems: 20
      required: [field_mapping, samples]
    MappingPreviewResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              product: {type: object, additionalProperties: true, description: The normalized platform product}
              errors: *id005
            required: [product]
      required: [results]
    CampaignInput:
      type: object
      properties:
        vendor_id: {type: string}
        status: {type: string}
        daily_budget_minor: {type: integer, format: int64}
        currency: {type: string}
        bid_minor: {type: integer, format: int64}
        targeting: {type: object, additionalProperties: true}
        start_at: {type: string, format: date-time}
        end_at:
          type: [string, 'null']
          format: date-time
      required: [vendor_id, daily_budget_minor, currency, bid_minor, start_at]
    Campaign:
      allOf:
      - {$ref: '#/components/schemas/CampaignInput'}
      - type: object
        properties:
          id: {type: string}
        required: [id]
    CreativeInput:
      type: object
      properties:
        product_id: {type: string}
      required: [product_id]
    Creative:
      allOf:
      - {$ref: '#/components/schemas/CreativeInput'}
      - type: object
        properties:
          id: {type: string}
          campaign_id: {type: string}
        required: [id, campaign_id]
    AdsReport:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              campaign_id: {type: string}
              impressions: {type: integer}
              clicks: {type: integer}
              spend_minor: {type: integer, format: int64}
              ctr: {type: number}
            required: [campaign_id, impressions, clicks, spend_minor, ctr]
      required: [rows]
    PlaygroundRequest:
      type: object
      additionalProperties: true
      description: A search-api SearchRequest (search.yaml) plus config_version.
      properties:
        config_version:
          oneOf:
          - {type: integer, minimum: 1}
          - {type: string, const: draft}
          default: draft
        q: {type: string}
    PlaygroundResponse: {type: object, additionalProperties: true, description: 'The search-api SearchResponse (search.yaml),
        always with the explain trace.'}
    AdminLoginRequest:
      type: object
      properties:
        email: {type: string, format: email}
        password: {type: string}
      required: [email, password]
    VerifyEmailRequest:
      type: object
      properties:
        token: {type: string}
      required: [token]
    CustomField:
      type: object
      properties:
        name: {type: string}
        type:
          type: string
          enum: [keyword, 'keyword[]', text, int, float, bool, date, object]
        source: {type: string, description: JSONPath}
        filterable: {type: boolean}
        facetable: {type: boolean}
        searchable: {type: boolean}
        sortable: {type: boolean}
        required: {type: boolean}
      required: [name, type, source]
    CatalogStep:
      type: object
      properties:
        ingestion:
          type: string
          enum: [events, upload]
        field_mapping: *id006
        custom_fields:
          type: array
          items: {$ref: '#/components/schemas/CustomField'}
        samples:
          type: array
          items: *id007
          maxItems: 20
      required: [ingestion, field_mapping]
      additionalProperties: false
    RetrievalStep:
      type: object
      properties:
        preset:
          type: string
          enum: [balanced, keyword, semantic, visual]
          default: balanced
        embedders: {type: object, additionalProperties: true, description: ConfigDocument embedders (platform only until M5)}
        stores: {type: object, additionalProperties: true, description: ConfigDocument stores (platform only until M5)}
      additionalProperties: false
    PoliciesStep:
      type: object
      properties:
        in_stock: {type: boolean}
        ship_to_region: {type: string}
        verified_vendors: {type: boolean}
        rules:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              kind: {type: string}
              expr: {type: string}
            required: [id, kind, expr]
      additionalProperties: false
    RankingStep:
      type: object
      properties:
        mode:
          type: string
          enum: [default, learned, byo]
          default: default
          description: learned and byo return not_available until M7
        weights:
          type: object
          additionalProperties: {type: number}
      additionalProperties: false
    PersonalizationStep:
      type: object
      properties:
        personalization: *id007
        diversity: *id007
        ads: *id007
      additionalProperties: false
    IndexBuildStep:
      type: object
      properties:
        upload_id: {type: string, description: Backfill from an upload instead of the catalog topic}
      additionalProperties: false
    GoLiveStep:
      type: object
      properties:
        mode:
          type: string
          enum: [activate]
          default: activate
        version: {type: integer, description: Defaults to the latest published version}
      additionalProperties: false
    DraftView:
      type: object
      properties:
        document: {$ref: '#/components/schemas/ConfigDocument'}
        schema_version: {type: integer}
        updated_at: *id004
        validation: {$ref: '#/components/schemas/ValidationResult'}
      required: [document, schema_version, updated_at]
    PlatformSettings:
      type: object
      properties:
        auth:
          type: object
          properties:
            password:
              type: object
              properties:
                memory_kib: {type: integer, minimum: 19456, maximum: 262144}
                time: {type: integer, minimum: 1}
                threads: {type: integer, minimum: 1}
              required: [memory_kib, time, threads]
            password_min_length: {type: integer, minimum: 8, maximum: 64}
            access_token_ttl: {type: string, description: 5m to 60m}
            refresh_token_ttl: {type: string, description: 24h to 720h}
            api_token_ttl: {type: string, description: 5m to 60m}
            key_rotation: {type: string, description: 7 to 90 days}
            key_retention: {type: string, description: 1 to 30 days and at least every token TTL}
            email_verification_ttl: {type: string, description: 1h to 7 days}
          required: [password, password_min_length, access_token_ttl, refresh_token_ttl, api_token_ttl, key_rotation, key_retention,
            email_verification_ttl]
      required: [auth]
    Plan:
      type: object
      properties:
        id: {type: string, readOnly: true}
        name: {type: string}
        max_total_ms: {type: integer}
        search_rps: {type: integer}
        search_burst: {type: integer}
        events_rps: {type: integer}
        byo_allowed: {type: boolean}
        egress_allowlist:
          type: array
          items: {type: string}
        max_custom_fields: {type: integer}
        max_page_depth: {type: integer}
      required: [name, max_total_ms, search_rps, search_burst, events_rps, byo_allowed, max_custom_fields, max_page_depth]
    SigningKey:
      type: object
      properties:
        kid: {type: string}
        status:
          type: string
          enum: [active, retired, revoked]
        created_at: *id004
        retired_at: *id004
        publish_until: *id004
      required: [kid, status, created_at]
    Tenant:
      type: object
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        plan: {type: string}
        region: {type: string}
        status: {type: string}
        created_at: *id004
        updated_at: *id004
      required: [id, slug, name, plan, region, status, created_at, updated_at]
