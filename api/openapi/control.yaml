openapi: 3.1.0
info: {title: control-api, version: 0.1.0, description: 'Control plane: tenants, auth, onboarding, config versions, connections,
    models, indexing, ads and playground.

    Source of truth for REST contracts (see docs/API.md).'}
servers:
- {url: 'http://localhost:8081'}
security:
- bearer: []
tags:
- {name: admin}
- {name: access}
- {name: ads}
- {name: auth}
- {name: config}
- {name: connections}
- {name: indexing}
- {name: models}
- {name: onboarding}
- {name: ops}
- {name: playground}
paths:
  /v1/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create tenant and owner user; seeds draft config and onboarding state
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignupRequest'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
          headers: &id001
            Set-Cookie:
              description: 'se_refresh: HttpOnly, SameSite=Strict, Path=/v1/; the rotating refresh token.'
              schema: {type: string}
        4XX: &id002 {$ref: '#/components/responses/Problem'}
      description: Creates the tenant, its owner, the default draft config and onboarding state, and emails a verification
        link. Idempotent with Idempotency-Key.
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
          headers: *id001
        4XX: *id002
  /v1/auth/token:
    post:
      operationId: exchangeApiKey
      tags: [auth]
      summary: Exchange a tenant API key for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        4XX: {$ref: '#/components/responses/Problem'}
      description: The token's TTL is the platform setting auth.api_token_ttl.
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate the refresh cookie and issue a new access token
      description: Reads the se_refresh cookie. Presenting a refresh token that was already rotated revokes its whole family
        (reuse detection) and returns 401.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
          headers: *id001
        4XX: *id002
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the refresh token family and clear the cookie
      security: []
      responses:
        '204': {description: No content}
        4XX: *id002
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with the token from the verification link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyEmailRequest'}
      responses:
        '204': {description: No content}
        4XX: *id002
  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Email a fresh verification link to the calling user
      responses:
        '202': {description: Accepted}
        4XX: *id002
  /.well-known/jwks.json:
    get:
      operationId: jwks
      tags: [auth]
      summary: JSON Web Key Set used by search-api
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JWKS'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Platform admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminLoginRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
          headers: *id001
        4XX: *id002
  /v1/admin/settings:
    get:
      operationId: getPlatformSettings
      tags: [admin]
      summary: Read platform settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformSettings'}
        4XX: *id002
    put:
      operationId: putPlatformSettings
      tags: [admin]
      summary: Replace platform settings (validated against bounds)
      description: Every control-api replica reloads via Redis pub/sub (platform.settings.changed).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformSettings'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformSettings'}
        4XX: *id002
  /v1/admin/plans:
    get:
      operationId: listPlans
      tags: [admin]
      summary: List plans
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Plan'}
        4XX: *id002
  /v1/admin/plans/{plan_id}:
    put:
      operationId: putPlan
      tags: [admin]
      summary: Create or replace a plan
      parameters:
      - name: plan_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        4XX: *id002
  /v1/admin/keys:
    get:
      operationId: listSigningKeys
      tags: [admin]
      summary: List JWT signing keys
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SigningKey'}
        4XX: *id002
  /v1/admin/keys/rotate:
    post:
      operationId: rotateSigningKey
      tags: [admin]
      summary: Rotate the signing key now
      description: The old key keeps verifying (published in the JWKS) until the retention window ends.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [active_kid]
                properties:
                  active_kid: {type: string}
        4XX: *id002
  /v1/admin/keys/{kid}/revoke:
    post:
      operationId: revokeSigningKey
      tags: [admin]
      summary: Revoke a signing key immediately
      description: Tokens signed by the key stop verifying at once; revoking the active key rotates first.
      parameters:
      - name: kid
        in: path
        required: true
        schema: {type: string}
      responses:
        '204': {description: No content}
        4XX: *id002
  /v1/admin/tenants:
    get:
      operationId: listTenants
      tags: [admin]
      summary: List tenants
      parameters:
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      - name: offset
        in: query
        required: false
        schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Tenant'}
        4XX: *id002
  /v1/tenants/{tid}/api-keys:
    get:
      operationId: listApiKeys
      tags: [access]
      summary: List API keys
      parameters:
      - &id003
        name: tid
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ApiKey'}
        4XX: *id002
    post:
      operationId: createApiKey
      tags: [access]
      summary: Create an API key (secret shown once)
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyCreated'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      tags: [access]
      summary: Revoke an API key
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: key_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '204': {description: No content}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/users:
    get:
      operationId: listUsers
      tags: [access]
      summary: List users
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/User'}
        4XX: *id002
    post:
      operationId: createUser
      tags: [access]
      summary: Add a user with an initial password (requires tenant:admin)
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        4XX: *id002
  /v1/tenants/{tid}/users/{user_id}:
    patch:
      operationId: updateUser
      tags: [access]
      summary: Change a user's role
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: user_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        4XX: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteUser
      tags: [access]
      summary: Remove a user
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: user_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '204': {description: No content}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/onboarding:
    get:
      operationId: getOnboarding
      tags: [onboarding]
      summary: Current step, completed steps, blockers
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnboardingState'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/onboarding/steps/{step}:
    put:
      operationId: saveOnboardingStep
      tags: [onboarding]
      summary: Save a step payload into the draft and validate it
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: step
        in: path
        required: true
        schema: {$ref: '#/components/schemas/OnboardingStep'}
      - name: use_defaults
        in: query
        required: false
        schema: {type: boolean}
        description: Apply platform defaults to the retrieval through personalization steps and mark them complete.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StepPayload'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StepResult'}
        4XX: {$ref: '#/components/responses/Problem'}
      description: Steps unlock in order; a completed step can be revisited. Invalid payloads return 422 with field errors
        and change nothing.
  /v1/onboarding/engine-explainer:
    get:
      operationId: getEngineExplainer
      tags: [onboarding]
      summary: Static stage descriptions, configurable options and defaults
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EngineExplainer'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/engine-explainer:
    get:
      operationId: getTenantEngineExplainer
      tags: [onboarding]
      summary: Engine explainer overlaid with the tenant's draft choices
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EngineExplainer'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/config/draft:
    get:
      operationId: getConfigDraft
      tags: [config]
      summary: Get the draft config
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftView'}
        4XX: *id002
    put:
      operationId: putConfigDraft
      tags: [config]
      summary: Replace the draft config
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigDocument'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftView'}
        4XX: *id002
      description: Saves the document even when it is invalid; the response carries the validation.
  /v1/tenants/{tid}/config/draft/validate:
    post:
      operationId: validateConfigDraft
      tags: [config]
      summary: Validate the draft and return every error
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationResult'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/config/versions:
    post:
      operationId: publishConfig
      tags: [config]
      summary: Publish the draft as the next immutable version
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigVersionSummary'}
        4XX: *id002
    get:
      operationId: listConfigVersions
      tags: [config]
      summary: List config versions
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ConfigVersionSummary'}
        4XX: *id002
  /v1/tenants/{tid}/config/versions/{v}:
    get:
      operationId: getConfigVersion
      tags: [config]
      summary: Get a config version
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: v
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigVersion'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/config/versions/{v}/activate:
    post:
      operationId: activateConfigVersion
      tags: [config]
      summary: Activate a version (rollback = activate an older one)
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: v
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigVersionSummary'}
        4XX: *id002
      description: Requires a verified email. The previous active version is retired and search-api switches within seconds
        (Redis pub/sub, with a 30 s reconcile as the fallback).
  /v1/tenants/{tid}/config/versions/{v}/shadow:
    post:
      operationId: shadowConfigVersion
      tags: [config]
      summary: Run a version in shadow on sampled traffic
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: v
        in: path
        required: true
        schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShadowRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigVersionSummary'}
        4XX: *id002
      description: sample_rate 0 clears shadow mode.
  /v1/tenants/{tid}/config/diff:
    get:
      operationId: diffConfigVersions
      tags: [config]
      summary: Diff two config versions
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: from
        in: query
        required: true
        schema: {type: integer}
      - name: to
        in: query
        required: true
        schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigDiff'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/secrets:
    post:
      operationId: createSecret
      tags: [connections]
      summary: Store a secret; the value is never readable again
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SecretCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretRef'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: List connections
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Connection'}
                  next_cursor:
                    type: [string, 'null']
        4XX: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createConnection
      tags: [connections]
      summary: Create a vector store or lexical connection
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/connections/{connection_id}:
    get:
      operationId: getConnection
      tags: [connections]
      summary: Get a connection
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: connection_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        4XX: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateConnection
      tags: [connections]
      summary: Update a connection
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: connection_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        4XX: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteConnection
      tags: [connections]
      summary: Delete a connection
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: connection_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '204': {description: No content}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/connections/{connection_id}/test:
    post:
      operationId: testConnection
      tags: [connections]
      summary: Health, collection exists, dims and metric match, sample query latency
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: connection_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectionTestResult'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/models:
    post:
      operationId: registerModel
      tags: [models]
      summary: Register a remote model or an uploaded ONNX artifact
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelInput'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Model'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/models/uploads:
    post:
      operationId: createModelUpload
      tags: [models]
      summary: Presigned S3 PUT for an ONNX artifact
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadRequest'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresignedUpload'}
        4XX: {$ref: '#/components/responses/Problem'}
  /v1/tenants/{tid}/models/{model_id}/validate:
    post:
      operationId: validateModel
      tags: [models]
      summary: Dry-run inference with probe inputs
      parameters:
      - name: tid
        in: path
        required: true
        schema: {type: string}
      - name: model_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
