openapi: 3.1.0
info:
  title: search-api
  version: 0.1.0
  description: |
    Data plane: text, image and similar-item search, plus interaction event ingestion.
    Source of truth for REST contracts (see docs/API.md). The tenant comes from the JWT `tid` claim only.
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  /v1/search:
    post:
      operationId: searchText
      summary: Text search
      description: "Scope `search:read`. The trace is returned only when `explain=true` and the token has `search:debug`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/search/image:
    post:
      operationId: searchImage
      summary: Image search
      description: Scope `search:read`. Optional refinement text is fused with RRF.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  contentMediaType: application/octet-stream
                  description: JPEG, PNG or WebP, at most 10 MB and 4096x4096.
                crop: { $ref: "#/components/schemas/CropBox" }
                q: { type: string, maxLength: 512 }
                filters: { $ref: "#/components/schemas/FilterExpr" }
                user: { $ref: "#/components/schemas/UserRef" }
                page: { $ref: "#/components/schemas/PageRequest" }
                explain: { type: boolean, default: false }
            encoding:
              image: { contentType: "image/jpeg, image/png, image/webp" }
              crop: { contentType: application/json }
              filters: { contentType: application/json }
              user: { contentType: application/json }
              page: { contentType: application/json }
      responses:
        "200":
          description: Ranked results with predicted categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageSearchResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/products/{product_id}/similar:
    get:
      operationId: similarProducts
      summary: Similar items from the product's stored vectors
      description: Scope `search:read`.
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        "200":
          description: Similar products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/events:
    post:
      operationId: ingestEvents
      summary: Ingest interaction events
      description: Scope `events:write`. Up to 500 events, deduplicated by `event_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/Event" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Process is live }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      security: []
      responses:
        "200": { description: Dependencies ready }
        "503": { $ref: "#/components/responses/Problem" }
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain: { schema: { type: string } }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)

  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path: { type: string, description: JSON Pointer }
        code: { type: string }
        message: { type: string }

    SearchRequest:
      type: object
      required: [q]
      properties:
        q: { type: string, minLength: 1, maxLength: 512 }
        filters: { $ref: "#/components/schemas/FilterExpr" }
        user: { $ref: "#/components/schemas/UserRef" }
        page: { $ref: "#/components/schemas/PageRequest" }
        explain: { type: boolean, default: false }

    FilterExpr:
      description: Combine with and/or, maximum nesting depth 3, on filterable canonical fields only.
      oneOf:
        - $ref: "#/components/schemas/FilterCondition"
        - type: object
          required: [and]
          properties:
            and: { type: array, minItems: 1, items: { $ref: "#/components/schemas/FilterExpr" } }
        - type: object
          required: [or]
          properties:
            or: { type: array, minItems: 1, items: { $ref: "#/components/schemas/FilterExpr" } }

    FilterCondition:
      type: object
      required: [field, op, value]
      properties:
        field: { type: string }
        op: { type: string, enum: [eq, ne, in, nin, gt, gte, lt, lte, contains, range] }
        value: {}

    UserRef:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }

    PageRequest:
      type: object
      properties:
        size: { type: integer, minimum: 1, maximum: 100, default: 24 }
        cursor: { type: [string, "null"] }

    CropBox:
      type: object
      required: [x, y, w, h]
      description: Source pixel coordinates.
      properties:
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1 }
        h: { type: integer, minimum: 1 }

    SearchResponse:
      type: object
      required: [request_id, config_version, degraded, results]
      properties:
        request_id: { type: string }
        config_version: { type: integer }
        degraded: { type: boolean }
        results:
          type: array
          items: { $ref: "#/components/schemas/Result" }
        facets:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [value, count]
              properties:
                value: { type: string }
                count: { type: integer }
        next_cursor: { type: [string, "null"] }
        trace:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Trace"

    ImageSearchResponse:
      allOf:
        - $ref: "#/components/schemas/SearchResponse"
        - type: object
          properties:
            predicted_categories:
              type: array
              items:
                type: object
                required: [id, confidence]
                properties:
                  id: { type: string }
                  confidence: { type: number }

    Result:
      type: object
      required: [product_id, score, sponsored, position]
      properties:
        product_id: { type: string }
        score: { type: number }
        sponsored: { type: boolean }
        position: { type: integer, minimum: 1 }
        product:
          type: object
          properties:
            title: { type: string }
            price_minor: { type: integer, format: int64 }
            currency: { type: string }
            image_url: { type: string }
            vendor_id: { type: string }

    Trace:
      type: object
      description: Per-stage explain trace (scope `search:debug`).
      required: [stages]
      properties:
        stages:
          type: array
          items:
            type: object
            required: [stage, provider, latency_ms, in_count, out_count, fallback]
            properties:
              stage: { type: string }
              provider: { type: string }
              version: { type: string }
              latency_ms: { type: number }
              in_count: { type: integer }
              out_count: { type: integer }
              fallback: { type: boolean }
              fallback_reason: { type: string }
              candidates:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [product_id]
                  properties:
                    product_id: { type: string }
                    scores:
                      type: object
                      additionalProperties: { type: number }

    Event:
      type: object
      required: [event_id, type, ts, product_id]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [impression, click, add_to_cart, order, rfq] }
        ts: { type: string, format: date-time }
        request_id: { type: string }
        product_id: { type: string }
        position: { type: integer, minimum: 1 }
        user_id: { type: string }
        session_id: { type: string }
        sponsored: { type: boolean }
        order_id: { type: string, description: Required when type is order. }
        quantity: { type: integer, minimum: 1, description: Required when type is order. }
        value_minor: { type: integer, format: int64, description: Required when type is order. }
