openapi: 3.1.0
info:
  title: search-api
  version: 0.1.0
  description: |
    Data plane: text, image and similar-item search, plus interaction event ingestion.
    Source of truth for REST contracts (see docs/API.md). The tenant comes from the JWT `tid` claim only.
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  /v1/search:
    post:
      operationId: searchText
      summary: Text search
      description: |
        Scope `search:read`. The trace is returned only when `explain=true` and the token has `search:debug`.
        Results come from an ordered snapshot of up to the plan's page depth, cached for 10 minutes, so
        cursor, page-number and offset paging are stable across requests. An expired or tampered cursor
        returns 400 with error code `invalid_cursor`. Price phrases in `q` ("under $50") become a
        `price_minor` filter. Exceeding the plan's rate limit returns 429 with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/search/image:
    post:
      operationId: searchImage
      summary: Image search
      description: |
        Scope `search:read`. The image is validated by magic bytes (JPEG, PNG or WebP), its header must
        report at most 4096x4096 before it is decoded, the optional crop is applied, and it is re-encoded
        to JPEG (dropping EXIF) before embedding. Optional refinement text `q` adds the text retrievers,
        fused with RRF, and enables facets. JSON parts may be sent as fields or as file parts. Paging
        works as in `/v1/search` (the snapshot is keyed by the image content, crop, text, filters and user).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  contentMediaType: application/octet-stream
                  description: JPEG, PNG or WebP, at most 10 MB and 4096x4096.
                crop: { $ref: "#/components/schemas/CropBox" }
                q: { type: string, maxLength: 512 }
                filters: { $ref: "#/components/schemas/FilterExpr" }
                user: { $ref: "#/components/schemas/UserRef" }
                page: { $ref: "#/components/schemas/PageRequest" }
                explain: { type: boolean, default: false }
            encoding:
              image: { contentType: "image/jpeg, image/png, image/webp" }
              crop: { contentType: application/json }
              filters: { contentType: application/json }
              user: { contentType: application/json }
              page: { contentType: application/json }
      responses:
        "200":
          description: Ranked results with predicted categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageSearchResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/products/{product_id}/similar:
    get:
      operationId: similarProducts
      summary: Similar items from the product's stored vectors
      description: |
        Scope `search:read`. Runs `vector_image` and `vector_text` on the product's stored vectors,
        applies the tenant's always_filters, excludes the product itself and ranks with the tenant's
        scorers. Returns at most `size` results without paging.
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        "200":
          description: Similar products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/events:
    post:
      operationId: ingestEvents
      summary: Ingest interaction events
      description: Scope `events:write`. Up to 500 events, deduplicated by `event_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/Event" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Process is live }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      security: []
      responses:
        "200": { description: Dependencies ready }
        "503": { $ref: "#/components/responses/Problem" }
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain: { schema: { type: string } }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)

  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path: { type: string, description: JSON Pointer }
        code: { type: string }
        message: { type: string }

    SearchRequest:
      type: object
      required: [q]
      properties:
        q: { type: string, minLength: 1, maxLength: 512 }
        filters: { $ref: "#/components/schemas/FilterExpr" }
        user: { $ref: "#/components/schemas/UserRef" }
        page: { $ref: "#/components/schemas/PageRequest" }
        explain: { type: boolean, default: false }

    FilterExpr:
      description: Combine with and/or, maximum nesting depth 3, on filterable canonical fields only.
      oneOf:
        - $ref: "#/components/schemas/FilterCondition"
        - type: object
          required: [and]
          properties:
            and: { type: array, minItems: 1, items: { $ref: "#/components/schemas/FilterExpr" } }
        - type: object
          required: [or]
          properties:
            or: { type: array, minItems: 1, items: { $ref: "#/components/schemas/FilterExpr" } }

    FilterCondition:
      type: object
      required: [field, op, value]
      properties:
        field: { type: string }
        op: { type: string, enum: [eq, ne, in, nin, gt, gte, lt, lte, contains, range] }
        value: {}

    UserRef:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }

    PageRequest:
      type: object
      description: Set at most one of cursor, number or offset; none means the first page.
      properties:
        size: { type: integer, minimum: 1, maximum: 100, default: 24 }
        cursor: { type: [string, "null"], description: Opaque cursor from a previous next_cursor. }
        number: { type: integer, minimum: 1, description: 1-based page number. }
        offset: { type: integer, minimum: 0, description: Zero-based result offset. }

    CropBox:
      type: object
      required: [x, y, w, h]
      description: Source pixel coordinates.
      properties:
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1 }
        h: { type: integer, minimum: 1 }

    SearchResponse:
      type: object
      required: [request_id, config_version, degraded, results, offset, total, total_pages, total_matches]
      properties:
        request_id: { type: string }
        config_version: { type: integer }
        degraded: { type: boolean, description: True when results may be incomplete because providers failed. }
        results:
          type: array
          items: { $ref: "#/components/schemas/Result" }
        facets:
          type: object
          description: Counts per facet field over the filtered lexical matches; a facet ignores the request conditions on its own field.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/FacetValue" }
        offset: { type: integer, description: Zero-based offset of the first result. }
        total: { type: integer, description: Ordered results available to page through (at most the plan's page depth). }
        total_pages: { type: integer }
        total_matches: { type: integer, description: "Lexical matches with every filter applied (counted up to 10,000)." }
        query:
          type: object
          description: How the query was understood.
          properties:
            normalized: { type: string }
            attributes:
              type: object
              additionalProperties: { type: array, items: { type: string } }
            categories:
              type: array
              items:
                type: object
                required: [id, confidence]
                properties:
                  id: { type: string }
                  confidence: { type: number }
        next_cursor: { type: [string, "null"] }
        trace:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Trace"

    FacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string, description: "The term, or from-to for a numeric range bucket (open ends left empty)." }
        count: { type: integer }
        from: { type: number }
        to: { type: number }

    ImageSearchResponse:
      allOf:
        - $ref: "#/components/schemas/SearchResponse"
        - type: object
          required: [predicted_categories]
          properties:
            predicted_categories:
              description: Similarity-weighted vote over the leaf categories of the 50 nearest image neighbours.
              type: array
              items:
                type: object
                required: [id, confidence]
                properties:
                  id: { type: string }
                  confidence: { type: number }

    Result:
      type: object
      required: [product_id, score, sponsored, position]
      properties:
        product_id: { type: string }
        score: { type: number }
        sponsored: { type: boolean }
        position: { type: integer, minimum: 1 }
        product:
          type: object
          properties:
            title: { type: string }
            brand: { type: string }
            price_minor: { type: integer, format: int64 }
            currency: { type: string }
            image_url: { type: string }
            vendor_id: { type: string }

    Trace:
      type: object
      description: Per-stage explain trace (scope `search:debug`).
      required: [stages]
      properties:
        stages:
          type: array
          items:
            type: object
            required: [stage, provider, latency_ms, in_count, out_count, fallback]
            properties:
              stage: { type: string }
              provider: { type: string }
              version: { type: string }
              latency_ms: { type: number }
              in_count: { type: integer }
              out_count: { type: integer }
              fallback: { type: boolean }
              fallback_reason: { type: string }
              error: { type: string }
              candidates:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [product_id]
                  properties:
                    product_id: { type: string }
                    scores:
                      type: object
                      additionalProperties: { type: number }

    Event:
      type: object
      required: [event_id, type, ts, product_id]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [impression, click, add_to_cart, order, rfq] }
        ts: { type: string, format: date-time }
        request_id: { type: string }
        product_id: { type: string }
        position: { type: integer, minimum: 1 }
        user_id: { type: string }
        session_id: { type: string }
        sponsored: { type: boolean }
        order_id: { type: string, description: Required when type is order. }
        quantity: { type: integer, minimum: 1, description: Required when type is order. }
        value_minor: { type: integer, format: int64, description: Required when type is order. }
