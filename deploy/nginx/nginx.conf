events {}

http {
  client_max_body_size 12m;

  upstream search_api  { server search-api:8080; }
  upstream control_api { server control-api:8081; }

  server {
    listen 80;

    location ~ ^/v1/(search|products|events|vendors) {
      proxy_pass http://search_api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location / {
      proxy_pass http://control_api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }
  }
}
