version: "2"
sql:
  - engine: mysql
    schema: db/migrations/mysql
    queries: db/queries/mysql
    gen:
      go:
        package: tenantdb
        out: internal/tenant/tenantdb
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: json
            go_type: encoding/json.RawMessage
