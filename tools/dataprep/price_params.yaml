# Lognormal price parameters per ABO product_type (docs/DATA.md §4).
# price = median_usd * exp(sigma * N(0, 1)), rounded to cents and clamped to [min_usd, max_usd].
# Types not listed use `default`.
default: { median_usd: 25, sigma: 0.6 }
min_usd: 0.99
max_usd: 5000

